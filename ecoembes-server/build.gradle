plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'es.deusto.sd.ecoembes'
version = '1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	mockitoAgent
}

dependencies {
	// Spring Boot Starter Web: embedded Tomcat server + REST controllers + JSON
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// SpringDoc OpenAPI: Swagger annotations and the Swagger UI page
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.named('test') {
	useJUnitPlatform()
	// Avoids JDK 25 warnings from Mockito during tests
	jvmArgs += ["-javaagent:${configurations.mockitoAgent.asPath}", '-Xshare:off']
}
